<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Augmenta OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0b;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 68% center;
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 58% 52% at 50% 48%,
            rgba(10, 10, 11, 0.62) 0%,
            rgba(10, 10, 11, 0.28) 58%,
            rgba(10, 10, 11, 0.5) 100%
          ),
          linear-gradient(
            105deg,
            rgba(185, 28, 28, 0.28) 0%,
            rgba(255, 92, 42, 0.12) 38%,
            transparent 70%
          );
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 96px 180px;
        text-align: center;
      }
      .mark {
        width: 36px;
        height: 36px;
        margin-bottom: 22px;
      }
      h1 {
        font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f3efe8;
        line-height: 1;
        text-shadow: 0 8px 40px rgba(10, 10, 11, 0.55);
        padding-left: 0.16em;
      }
      .rule {
        width: 72px;
        height: 2px;
        background: #ff5c2a;
        margin: 22px 0 16px;
        border-radius: 1px;
      }
      p {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: #f3efe8;
        opacity: 0.82;
        padding-left: 0.36em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="HERO_SRC" alt="" />
      <div class="wash"></div>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle
            cx="16"
            cy="16"
            r="8.5"
            fill="none"
            stroke="#F3EFE8"
            stroke-width="1.6"
          />
          <circle
            cx="16"
            cy="16"
            r="4.2"
            fill="none"
            stroke="#FF5C2A"
            stroke-width="1.4"
          />
          <circle cx="16" cy="16" r="1.4" fill="#F3EFE8" />
        </svg>
        <h1>Augmenta</h1>
        <div class="rule"></div>
        <p>Human Evolution</p>
      </div>
    </div>
  </body>
</html>
